[workspace]
resolver = "3"
members = ["crates/*"]
# Vendored with local patches; a path dependency of x4kas-gui, not linted or formatted here.
exclude = ["vendor/egui_term"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/smartgoo/x4kas"
readme = "README.md"
publish = false

[workspace.dependencies]
x4kas-core = { path = "crates/x4kas-core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
kaspa-rpc-core = { git = "https://github.com/kaspanet/rusty-kaspa.git", rev = "01b532e" }
kaspa-wrpc-client = { git = "https://github.com/kaspanet/rusty-kaspa.git", rev = "01b532e" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
toml = "0.8"
dirs = "5"
bincode = "1"
futures = "0.3"
async-channel = "2"
indexmap = { version = "2", features = ["serde"] }
eframe = "0.33"
egui_extras = "0.33"
# Integrated terminal widget, vendored with patches (see vendor/egui_term/Cargo.toml).
egui_term = { path = "vendor/egui_term" }
